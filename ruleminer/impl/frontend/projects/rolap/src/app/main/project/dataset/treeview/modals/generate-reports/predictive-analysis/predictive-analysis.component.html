<rolap-loader *ngIf="!reportFormData" />

<div *ngIf="reportFormData?.reportFormGroup" class="breakpoint-container mt2 p1" id="mainSection">
  <rolap-report-form [data]="reportFormData" />

  <div class="row mt2">
    <div class="col-lg-12 col-md-12 col-sm-12 align-end">
      <dx-button
        [disabled]="!reportFormData.reportFormGroup.valid"
        stylingMode="contained"
        type="default"
        text="{{ 'project.treeview.context_menu.modal.generate_reports.generate_report_button' | translate }}"
        (onClick)="generateReport()">
      </dx-button>
    </div>
  </div>
</div>
