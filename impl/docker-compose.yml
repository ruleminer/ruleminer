version: "3.9"

services:
  # ==================================================
  #              AUTHENTICATION
  # ==================================================
  auth-db:
    container_name: auth-db
    image: postgres:15.2
    profiles: ["local"]
    restart: always
    volumes:
      - auth-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: $KEYCLOAK_DB_USERNAME
      POSTGRES_PASSWORD: $KEYCLOAK_DB_PASSWORD
    ports:
      - ${KEYCLOAK_DB_HOST_PORT}:${KEYCLOAK_DB_PORT}
  keycloak:
    container_name: keycloak
    profiles: ["local"]
    restart: always
    build:
      dockerfile: ./keycloak/Dockerfile
    entrypoint:
      ["/opt/keycloak/bin/kc.sh", "start", "--optimized", "--import-realm"]
    depends_on:
      - auth-db
    volumes:
      - ./keycloak/imports:/opt/keycloak/bin/../data/import
      - ./keycloak/exports:/exports
      - ./keycloak/scripts:/scripts
    environment:
      KEYCLOAK_ADMIN: $KEYCLOAK_ADMIN_USERNAME
      KEYCLOAK_ADMIN_PASSWORD: $KEYCLOAK_ADMIN_PASSWORD
      KC_DB: $KEYCLOAK_DB_VENDOR
      KC_DB_URL: $KEYCLOAK_DB_URL
      KC_DB_USERNAME: $KEYCLOAK_DB_USERNAME
      KC_DB_PASSWORD: $KEYCLOAK_DB_PASSWORD
      KC_HOSTNAME: $KC_HOSTNAME
      KC_HOSTNAME_STRICT: false #deactivate fixed hostname
      KC_HOSTNAME_STRICT_HTTPS: false #For local access to console admin in start mode
      KC_HTTP_ENABLED: true
      JOHN_PASSWORD: $JOHN_PASSWORD
      OPERATOR_PASSWORD: $OPERATOR_PASSWORD
      WORKER_KEYCLOAK_PASSWORD: $WORKER_KEYCLOAK_PASSWORD
      EMAIL_HOST: $EMAIL_HOST
      EMAIL_PORT: $EMAIL_PORT
      EMAIL_HOST_USER: $EMAIL_HOST_USER
      EMAIL_HOST_PASSWORD: $EMAIL_HOST_PASSWORD
    ports:
      - "${KEYCLOAK_HTTP_HOST_PORT}:${KEYCLOAK_HTTP_PORT}"
  # ==================================================
  #              REST API - TWO INSTANCES
  # ==================================================
  rest-api:
    container_name: rest-api
    profiles: ["local"]
    restart: always
    build:
      context: ./
      dockerfile: ./portal-service/Dockerfile
      args:
        DJANGO_SETTINGS_MODULE: $DJANGO_SETTINGS_MODULE
    command:
      [
        "gunicorn",
        "-b 0.0.0.0:8000",
        "-w 9",
        "-k sync",
        "-t 60",
        "rolap.wsgi:application",
      ]
    volumes:
      - ./portal-service:/app
      - ./libraries/keycloak-auth:/packages/keycloak-auth
      - ./storage/rolap_data_storage:/packages/rolap_data_storage
      - ./libraries/http_client:/packages/http_client
      - ./portal-service/rolap/logs:/app/rolap/logs
      - ./test-data/test_data/jsons:/app/test_data/jsons
      - ./libraries/emag-reports/emag_reports/models:/app/emag_report_models
    environment:
      REST_API_DB_USER: $REST_API_DB_USER
      REST_API_DB_PASSWORD: $REST_API_DB_PASSWORD
      REST_API_DB_NAME: $REST_API_DB_NAME
      REST_API_DB_HOST: $REST_API_DB_HOST
      REST_API_DB_PORT: $REST_API_DB_PORT
      REST_API_SECRET_KEY: $REST_API_SECRET_KEY
      KEYCLOAK_URL: $KEYCLOAK_URL
      KEYCLOAK_REALM: $KEYCLOAK_REALM
      KEYCLOAK_CLIENT_ID: $KEYCLOAK_CLIENT_ID
      KEYCLOAK_CLIENT_SECRET: $KEYCLOAK_CLIENT_SECRET
      KEYCLOAK_ADMIN_USERNAME: $KEYCLOAK_ADMIN_USERNAME
      KEYCLOAK_ADMIN_PASSWORD: $KEYCLOAK_ADMIN_PASSWORD
      # settings for storage v2 - postgres
      STORAGE_DB_USER: $STORAGE_DB_USER
      STORAGE_DB_PASSWORD: $STORAGE_DB_PASSWORD
      STORAGE_DB_NAME: $STORAGE_DB_NAME
      STORAGE_DB_HOST: $STORAGE_DB_HOST
      STORAGE_DB_PORT: $STORAGE_DB_PORT
      DJANGO_SETTINGS_MODULE: $DJANGO_SETTINGS_MODULE
      RULES_EVALUATION_SERVICE_URL: $RULES_EVALUATION_SERVICE_URL
      # worker settings
      CELERY_BROKER_URL: $CELERY_BROKER_URL
      CELERY_TASK_DEFAULT_EXCHANGE: $CELERY_TASK_DEFAULT_EXCHANGE
      CELERY_TASK_QUEUE_NAME: $CELERY_TASK_QUEUE_NAME
      CELERY_TASK_QUEUE_KEY: $CELERY_TASK_QUEUE_KEY
      REPORT_TASK_QUEUE_NAME: $REPORT_TASK_QUEUE_NAME
      REPORT_TASK_QUEUE_KEY: $REPORT_TASK_QUEUE_KEY
      # reports SFTP server credentials
      REPORTS_SFTP_HOST: $REPORTS_SFTP_HOST
      REPORTS_SFTP_PORT: $REPORTS_SFTP_PORT
      REPORTS_SFTP_USERNAME: $REPORTS_SFTP_USERNAME
      REPORTS_SFTP_PASSWORD: $REPORTS_SFTP_PASSWORD
      # round decimal places
      ROUND_DECIMAL_PLACES: $ROUND_DECIMAL_PLACES
      # dataset limits
      DATASET_MAX_ROWS: $DATASET_MAX_ROWS
      DATASET_MAX_COLUMNS: $DATASET_MAX_COLUMNS
      DATASET_MAX_SIZE_MB: $DATASET_MAX_SIZE_MB
      DATASET_MAX_SUM_SIZE_MB: $DATASET_MAX_SUM_SIZE_MB
      # validation
      ATTRIBUTES_REGEX: $ATTRIBUTES_REGEX
      RULESET_NAME_REGEX: $RULESET_NAME_REGEX
      # stripe
      STRIPE_TEST_PUBLIC: $STRIPE_TEST_PUBLIC
      STRIPE_TEST_SECRET: $STRIPE_TEST_SECRET
      STRIPE_WEBHOOK_SECRET: $STRIPE_WEBHOOK_SECRET
    depends_on:
      - rest-api-db
  calc-rest-api:
    extends:
      service: rest-api
    container_name: calc-rest-api
    command:
      [
        "gunicorn",
        "-b 0.0.0.0:8000",
        "-w 9",
        "-k sync",
        "-t 600",
        "rolap.wsgi:application",
      ]
  # ==================================================
  #              REST API DB
  # ==================================================
  rest-api-db:
    image: postgres:15.2
    profiles: ["local"]
    container_name: rest-api-db
    restart: always
    volumes:
      - rest-api-db:/var/lib/postgresql/data
      - ./rest-api-db:/docker-entrypoint-initdb.d/
    environment:
      POSTGRES_USER: $REST_API_DB_ADMIN_USER
      POSTGRES_PASSWORD: $REST_API_DB_ADMIN_PASSWORD
      REST_API_DB_USER: $REST_API_DB_USER
      REST_API_DB_PASSWORD: $REST_API_DB_PASSWORD
      REST_API_DB_NAME: $REST_API_DB_NAME
    ports:
      - "${REST_API_DB_HOST_PORT}:${REST_API_DB_PORT}"
  # ==================================================
  #              STORAGE
  # ==================================================
  storage-db:
    image: postgres:15.2
    profiles: ["local"]
    container_name: storage-db
    restart: always
    volumes:
      - storage-db:/var/lib/postgresql/data
      - ./storage/scripts:/docker-entrypoint-initdb.d/
    environment:
      POSTGRES_USER: $STORAGE_DB_ADMIN_USER
      POSTGRES_PASSWORD: $STORAGE_DB_ADMIN_PASSWORD
      STORAGE_DB_USER: $STORAGE_DB_USER
      STORAGE_DB_PASSWORD: $STORAGE_DB_PASSWORD
      STORAGE_DB_NAME: $STORAGE_DB_NAME
    ports:
      - "${STORAGE_DB_HOST_PORT}:${STORAGE_DB_PORT}"
  # ==================================================
  #              RULES EVALUATION SERVICE
  # ==================================================
  rules-evaluation-service:
    container_name: rules-evaluation-service
    profiles: ["local"]
    restart: always
    build:
      context: ./
      dockerfile: ./rules-evaluation-service/Dockerfile
    command:
      [
        "gunicorn",
        "-b 0.0.0.0:9000",
        "-w 9",
        "-k uvicorn.workers.UvicornWorker",
        "-t 600",
        "app:app",
      ]
    volumes:
      - ./rules-evaluation-service:/app
      - ./storage/rolap_data_storage:/packages/rolap_data_storage
      - ./rules-evaluation-service/logs:/app/logs
    ports:
      - "${RULES_EVALUATION_SERVICE_HOST_PORT}:${RULES_EVALUATION_SERVICE_PORT}"
    environment:
      STORAGE_DB_USER: $STORAGE_DB_USER
      STORAGE_DB_PASSWORD: $STORAGE_DB_PASSWORD
      STORAGE_DB_NAME: $STORAGE_DB_NAME
      STORAGE_DB_HOST: $RES_STORAGE_DB_HOST
      STORAGE_DB_PORT: $RES_STORAGE_DB_PORT
      #round decimal places
      ROUND_DECIMAL_PLACES: $ROUND_DECIMAL_PLACES
  # ==================================================
  #              FRONTEND AND PROXY
  # ==================================================
  frontend:
    container_name: frontend
    profiles: ["local"]
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
      args:
        HOST: ${HOST}
        REST_API_HOST_PORT: ${REST_API_HOST_PORT}
        KEYCLOAK_HTTP_HOST_PORT: ${KEYCLOAK_HTTP_HOST_PORT}
    ports:
      - "${FRONTEND_HOST_PORT}:42"
      - "${REST_API_HOST_PORT}:80"
    restart: always
    depends_on:
      - rest-api
  # ==================================================
  #              RABBITMQ
  # ==================================================
  rabbitmq:
    image: rabbitmq:3-management
    profiles: ["local"]
    ports:
      - ${RABBITMQ_HOST_PORT}:${RABBITMQ_PORT} # RabbitMQ default port
      - ${RABBITMQ_MGMT_HOST_PORT}:${RABBITMQ_MGMT_PORT} # RabbitMQ management UI port
      - ${RABBITMQ_METRICS_HOST_PORT}:${RABBITMQ_METRICS_PORT}
    volumes:
      - ./rabbitmq:/var/lib/rabbitmq # Persist data to a local folder
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
    environment:
      RABBITMQ_DEFAULT_USER: $CELERY_BROKER_USERNAME
      RABBITMQ_DEFAULT_PASS: $CELERY_BROKER_PASSWORD
      METRICS_PROMETHEUS: "true"
    hostname: rabbitmq
    container_name: rabbitmq
    restart: always
  # ==================================================
  #              RULE GENERATION WORKER
  # ==================================================
  celery-worker:
    container_name: celery-worker
    profiles: ["local"]
    build:
      context: ./
      dockerfile: ./rule-service/rule_generation_service/Dockerfile
    command:
      [
        "celery",
        "-A",
        "worker",
        "worker",
        "-l",
        "info",
        "--pool=prefork",
        "--autoscale=${WORKER_MAX_PROCESSES},1",
      ]
    volumes:
      - ./rule-service/rule_generation_service/logs:/app/logs
      - ./rule-service/rule_generation_service:/app
      - ./libraries/http_client:/packages/http_client
      - ./storage/rolap_data_storage:/packages/rolap_data_storage
    ports:
      - ${CELERY_HOST_PORT}:${CELERY_PORT}
    depends_on:
      - rabbitmq
    environment:
      CELERY_BROKER_URL: $CELERY_BROKER_URL
      CELERY_TASK_DEFAULT_EXCHANGE: $CELERY_TASK_DEFAULT_EXCHANGE
      CELERY_TASK_QUEUE_KEY: $CELERY_TASK_QUEUE_KEY
      CELERY_TASK_QUEUE_NAME: $CELERY_TASK_QUEUE_NAME
      STORAGE_DB_USER: $STORAGE_DB_USER
      STORAGE_DB_PASSWORD: $STORAGE_DB_PASSWORD
      STORAGE_DB_NAME: $STORAGE_DB_NAME
      STORAGE_DB_HOST: $STORAGE_DB_HOST
      STORAGE_DB_PORT: $STORAGE_DB_PORT
      WORKER_KEYCLOAK_CLIENT_ID: $WORKER_KEYCLOAK_CLIENT_ID
      WORKER_KEYCLOAK_CLIENT_SECRET: $WORKER_KEYCLOAK_CLIENT_SECRET
      WORKER_KEYCLOAK_USERNAME: $WORKER_KEYCLOAK_USERNAME
      WORKER_KEYCLOAK_PASSWORD: $WORKER_KEYCLOAK_PASSWORD
      WORKER_KEYCLOAK_SCOPE: $WORKER_KEYCLOAK_SCOPE
      WORKER_KEYCLOAK_URL: $WORKER_KEYCLOAK_URL
      KEYCLOAK_REALM: $KEYCLOAK_REALM
      WORKER_REST_API_SCHEME: $WORKER_REST_API_SCHEME
      WORKER_REST_API_HOST: $WORKER_REST_API_HOST
      WORKER_REST_API_PORT: $WORKER_REST_API_PORT
      #round decimal places
      ROUND_DECIMAL_PLACES: $ROUND_DECIMAL_PLACES
      # validation
      ATTRIBUTES_REGEX: $ATTRIBUTES_REGEX
      RULESET_NAME_REGEX: $RULESET_NAME_REGEX
    restart: always
  # ==================================================
  #      REPORT GENERATION WORKER AND FILE SERVER
  # ==================================================
  report-generator:
    container_name: report-generator
    profiles: ["local"]
    build:
      context: ./
      dockerfile: ./report-generator/Dockerfile
    command:
      [
        "celery",
        "-A",
        "worker",
        "worker",
        "-l",
        "info",
        "--pool=prefork",
        "--autoscale=${WORKER_MAX_PROCESSES},1",
      ]
    volumes:
      - ./report-generator:/app
      - ./reports:/reports
      - ./libraries/http_client:/packages/http_client
      - ./libraries/emag-reports:/packages/emag-reports
      - ./storage/rolap_data_storage:/packages/rolap_data_storage
    environment:
      # round decimal places
      ROUND_DECIMAL_PLACES: $ROUND_DECIMAL_PLACES
      # queue data
      CELERY_BROKER_URL: $CELERY_BROKER_URL
      CELERY_TASK_DEFAULT_EXCHANGE: $CELERY_TASK_DEFAULT_EXCHANGE
      REPORT_TASK_QUEUE_KEY: $REPORT_TASK_QUEUE_KEY
      REPORT_TASK_QUEUE_NAME: $REPORT_TASK_QUEUE_NAME
      # dataset storage data
      STORAGE_DB_USER: $STORAGE_DB_USER
      STORAGE_DB_PASSWORD: $STORAGE_DB_PASSWORD
      STORAGE_DB_NAME: $STORAGE_DB_NAME
      STORAGE_DB_HOST: $STORAGE_DB_HOST
      STORAGE_DB_PORT: $STORAGE_DB_PORT
      # keycloak data
      WORKER_KEYCLOAK_CLIENT_ID: $WORKER_KEYCLOAK_CLIENT_ID
      WORKER_KEYCLOAK_CLIENT_SECRET: $WORKER_KEYCLOAK_CLIENT_SECRET
      WORKER_KEYCLOAK_USERNAME: $WORKER_KEYCLOAK_USERNAME
      WORKER_KEYCLOAK_PASSWORD: $WORKER_KEYCLOAK_PASSWORD
      WORKER_KEYCLOAK_SCOPE: $WORKER_KEYCLOAK_SCOPE
      WORKER_KEYCLOAK_URL: $WORKER_KEYCLOAK_URL
      KEYCLOAK_REALM: $KEYCLOAK_REALM
      # rest-api data
      WORKER_REST_API_SCHEME: $WORKER_REST_API_SCHEME
      WORKER_REST_API_HOST: $WORKER_REST_API_HOST
      WORKER_REST_API_PORT: $WORKER_REST_API_PORT
      # reports SFTP server credentials
      REPORTS_SFTP_HOST: $REPORTS_SFTP_HOST
      REPORTS_SFTP_PORT: $REPORTS_SFTP_PORT
      REPORTS_SFTP_USERNAME: $REPORTS_SFTP_USERNAME
      REPORTS_SFTP_PASSWORD: $REPORTS_SFTP_PASSWORD
    depends_on:
      - rabbitmq
    restart: always
  reports-sftp:
    container_name: reports-sftp
    hostname: reports-sftp
    restart: always
    profiles: ["local"]
    build:
      context: ./reports-sftp
      dockerfile: ./Dockerfile
      args:
        USERNAME: ${REPORTS_SFTP_USERNAME}
        PASSWORD: ${REPORTS_SFTP_PASSWORD}
    ports:
      - "${REPORTS_SFTP_HOST_PORT}:22"
    volumes:
      - "./reports:/home/${REPORTS_SFTP_USERNAME}"
  # ==================================================
  #              BUGS USER REPORTING SERVICE
  # ==================================================
  bug-reporting-service:
    container_name: bug-reporting-service
    profiles: ["local"]
    restart: always
    build:
      context: ./
      dockerfile: ./bug-reporting-service/Dockerfile
      args:
        DJANGO_SETTINGS_MODULE: $DJANGO_SETTINGS_MODULE
    command:
      [
        "gunicorn",
        "-b 0.0.0.0:8000",
        "-w 9",
        "-k sync",
        "-t 60",
        "bug_reporting_service.wsgi:application",
      ]
    volumes:
      - ./bug-reporting-service:/app
      - ./bug-reporting-service/screenshots:/screenshots
      - ./libraries/keycloak-auth:/packages/keycloak-auth
    environment:
      DB_USER: $BUGS_REPORTING_DB_USER
      DB_PASSWORD: $BUGS_REPORTING_DB_PASSWORD
      DB_NAME: $BUGS_REPORTING_DB_NAME
      DB_HOST: $BUGS_REPORTING_DB_HOST
      DB_PORT: $BUGS_REPORTING_DB_PORT
      SECRET_KEY: $BUGS_REPORTING_SECRET_KEY
      KEYCLOAK_URL: $KEYCLOAK_URL
      KEYCLOAK_REALM: $KEYCLOAK_REALM
      KEYCLOAK_CLIENT_ID: $KEYCLOAK_CLIENT_ID
      KEYCLOAK_CLIENT_SECRET: $KEYCLOAK_CLIENT_SECRET
      KEYCLOAK_ADMIN_USERNAME: $KEYCLOAK_ADMIN_USERNAME
      KEYCLOAK_ADMIN_PASSWORD: $KEYCLOAK_ADMIN_PASSWORD
      EMAIL_HOST: $EMAIL_HOST
      EMAIL_PORT: $EMAIL_PORT
      EMAIL_HOST_USER: $EMAIL_HOST_USER
      EMAIL_HOST_PASSWORD: $EMAIL_HOST_PASSWORD
      EMAILS_RECEIVERS: $BUG_REPORTING_EMAILS_RECEIVERS
    depends_on:
      - bug-reporting-db
  # ==================================================
  #              BUGS USER REPORTING DB
  # ==================================================
  bug-reporting-db:
    image: postgres:15.2
    profiles: ["local"]
    container_name: bug-reporting-db
    restart: always
    volumes:
      - bug-reporting-db:/var/lib/postgresql/data
      - ./bug-reporting-db:/docker-entrypoint-initdb.d/
    environment:
      POSTGRES_USER: $BUGS_REPORTING_DB_ADMIN_USER
      POSTGRES_PASSWORD: $BUGS_REPORTING_DB_ADMIN_PASSWORD
      DB_USER: $BUGS_REPORTING_DB_USER
      DB_PASSWORD: $BUGS_REPORTING_DB_PASSWORD
      DB_NAME: $BUGS_REPORTING_DB_NAME
    ports:
      - "${BUGS_REPORTING_DB_HOST_PORT}:${BUGS_REPORTING_DB_PORT}"
  # ==================================================
  #              OTHER SETTINGS
  # ==================================================
volumes:
  auth-db:
  rest-api-db:
  storage-db:
  bug-reporting-db:
